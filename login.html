<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập - Phiếu Điền Đáp Án THPTQG 2025</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;600;800&display=swap');
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        /* BACKGROUND TRẮNG & SƯƠNG MÙ NEON NHẸ */
        body { 
            font-family: 'Be Vietnam Pro', system-ui, sans-serif; 
            background-color: #f4f7f9; 
            color: #1e293b; 
            line-height: 1.6; 
            padding: 30px 20px; 
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        body::before, body::after {
            content: ''; position: fixed; border-radius: 50%; filter: blur(100px); z-index: -1;
            animation: float 10s infinite alternate ease-in-out;
        }
        body::before { width: 500px; height: 500px; background: rgba(0, 242, 254, 0.15); top: -100px; left: -100px; }
        body::after { width: 600px; height: 600px; background: rgba(224, 36, 206, 0.1); bottom: -150px; right: -150px; animation-delay: -5s; }
        @keyframes float { 0% { transform: translateY(0) scale(1); } 100% { transform: translateY(30px) scale(1.05); } }

        /* Container chính */
        .login-container {
            width: 100%;
            max-width: 420px;
            background: rgba(255, 255, 255, 0.95); 
            backdrop-filter: blur(20px); 
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px; 
            border: 1px solid rgba(255, 255, 255, 1);
            box-shadow: 0 10px 40px rgba(0,0,0,0.1), 0 0 20px rgba(0, 242, 254, 0.1); 
            padding: 50px 40px;
            animation: slideIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Tiêu đề */
        .login-title {
            text-align: center;
            margin-bottom: 15px;
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #0072ff 0%, #00c6ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }

        .login-subtitle {
            text-align: center;
            color: #64748b;
            font-size: 0.95rem;
            margin-bottom: 40px;
            font-weight: 400;
        }

        /* Input group */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #475569;
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group input {
            width: 100%;
            padding: 14px 18px;
            font-size: 16px;
            font-family: inherit;
            background: #f8fafc;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            color: #0f172a;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .form-group input::placeholder {
            color: #cbd5e1;
            font-weight: 400;
        }

        .form-group input:focus {
            outline: none;
            border-color: #00d4ff;
            background: #ffffff;
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.4);
        }

        .form-group input:invalid:not(:placeholder-shown) {
            border-color: #ff1744;
        }

        /* Checkbox Remember */
        .remember-forgot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            font-size: 0.9rem;
        }

        .remember-forgot a {
            color: #00d4ff;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s;
        }

        .remember-forgot a:hover {
            color: #0072ff;
        }

        .checkbox-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .checkbox-wrapper input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #00d4ff;
            cursor: pointer;
        }

        .checkbox-wrapper label {
            margin: 0;
            cursor: pointer;
            color: #64748b;
            font-weight: 500;
            text-transform: none;
        }

        /* Nút đăng nhập */
        .login-btn {
            width: 100%;
            padding: 16px;
            font-size: 16px;
            font-family: inherit;
            color: #ffffff;
            background: linear-gradient(90deg, #00c6ff, #0072ff);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 10px 20px rgba(0, 198, 255, 0.4);
            transition: all 0.3s ease;
            margin-bottom: 15px;
        }

        .login-btn:hover:not(:disabled) {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 15px 30px rgba(0, 198, 255, 0.6);
        }

        .login-btn:active:not(:disabled) {
            transform: translateY(-1px) scale(1);
        }

        .login-btn:disabled {
            background: #e2e8f0;
            box-shadow: none;
            color: #94a3b8;
            cursor: not-allowed;
            opacity: 0.6;
        }

        /* Divider */
        .divider {
            display: flex;
            align-items: center;
            margin: 25px 0;
            gap: 15px;
            color: #cbd5e1;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #e2e8f0;
        }

        .divider span {
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Footer */
        .login-footer {
            text-align: center;
            color: #64748b;
            font-size: 0.9rem;
        }

        .login-footer a {
            color: #00d4ff;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s;
        }

        .login-footer a:hover {
            color: #0072ff;
        }

        /* Error message */
        .error-message {
            background: rgba(255, 23, 68, 0.1);
            border: 1px solid #ff1744;
            color: #d50000;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 0.9rem;
            margin-bottom: 20px;
            display: none;
            animation: shake 0.4s;
        }

        .error-message.show {
            display: block;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        /* Success message */
        .success-message {
            background: rgba(0, 230, 118, 0.1);
            border: 1px solid #00e676;
            color: #00c853;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 0.9rem;
            margin-bottom: 20px;
            display: none;
            animation: slideDown 0.4s;
        }

        .success-message.show {
            display: block;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 40px 25px;
            }

            .login-title {
                font-size: 1.5rem;
            }

            .remember-forgot {
                flex-direction: column;
                gap: 12px;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>

<div class="login-container">
    <h1 class="login-title">ĐĂNG NHẬP</h1>
    <p class="login-subtitle">Phiếu Điền Đáp Án THPTQG 2025</p>

    <div class="error-message" id="errorMessage"></div>
    <div class="success-message" id="successMessage"></div>

    <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
            <label for="email">Email</label>
            <input 
                type="email" 
                id="email" 
                name="email" 
                placeholder="Nhập địa chỉ email..." 
                required
                autocomplete="email"
            >
        </div>

        <div class="form-group">
            <label for="password">Mật Khẩu</label>
            <input 
                type="password" 
                id="password" 
                name="password" 
                placeholder="Nhập mật khẩu..." 
                required
                autocomplete="current-password"
            >
        </div>

        <div class="remember-forgot">
            <div class="checkbox-wrapper">
                <input type="checkbox" id="rememberMe" name="rememberMe">
                <label for="rememberMe">Ghi nhớ tôi</label>
            </div>
            <a href="#forgot">Quên mật khẩu?</a>
        </div>

        <button type="submit" class="login-btn" id="loginBtn">Đăng Nhập</button>
    </form>

    <div class="divider">
        <span>HOẶC</span>
    </div>

    <p class="login-footer">
        Chưa có tài khoản? <a href="#signup">Đăng ký tại đây</a>
    </p>
</div>

<script>
    // Demo user credentials (trong thực tế sẽ kết nối với backend)
    const DEMO_USERS = {
        "user@example.com": "password123",
        "test@gmail.com": "test123",
        "student@school.com": "student123"
    };

    function handleLogin(event) {
        event.preventDefault();
        
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;
        const rememberMe = document.getElementById("rememberMe").checked;
        const loginBtn = document.getElementById("loginBtn");
        const errorMsg = document.getElementById("errorMessage");
        const successMsg = document.getElementById("successMessage");

        // Clear messages
        errorMsg.classList.remove("show");
        successMsg.classList.remove("show");

        // Disable button
        loginBtn.disabled = true;
        loginBtn.innerText = "ĐANG XỬ LÝ...";

        // Simulate API call
        setTimeout(() => {
            // Kiểm tra credentials (demo)
            if (DEMO_USERS[email] && DEMO_USERS[email] === password) {
                // Lưu thông tin nếu chọn "Ghi nhớ"
                if (rememberMe) {
                    localStorage.setItem("rememberedEmail", email);
                } else {
                    localStorage.removeItem("rememberedEmail");
                }

                // Lưu session
                sessionStorage.setItem("userEmail", email);
                sessionStorage.setItem("isLoggedIn", "true");

                successMsg.innerText = "✔ Đăng nhập thành công! Đang chuyển hướng...";
                successMsg.classList.add("show");

                // Chuyển sang trang chọn đề
                setTimeout(() => {
                    window.location.href = "select-exam.html";
                }, 1500);
            } else {
                errorMsg.innerText = "✘ Email hoặc mật khẩu không chính xác!";
                errorMsg.classList.add("show");
                loginBtn.disabled = false;
                loginBtn.innerText = "Đăng Nhập";
            }
        }, 800);
    }

    // Load remembered email
    window.addEventListener("DOMContentLoaded", () => {
        const rememberedEmail = localStorage.getItem("rememberedEmail");
        if (rememberedEmail) {
            document.getElementById("email").value = rememberedEmail;
            document.getElementById("rememberMe").checked = true;
        }

        // Check if already logged in
        if (sessionStorage.getItem("isLoggedIn") === "true") {
            window.location.href = "select-exam.html";
        }
    });

    // Password visibility toggle
    document.addEventListener("DOMContentLoaded", () => {
        const passwordInput = document.getElementById("password");
        // Thêm tính năng show/hide password nếu cần
    });
</script>

</body>
</html>
